name: release

# A pushed tag v<x.y.z> builds the four programs and publishes a GitHub release
# with SHA256SUMS. The tag must match package.json's version
# (scripts/ci/release-files.sh refuses otherwise). Every action is pinned by
# commit SHA.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # checkout leaves the tag as a lightweight ref; fetch the annotated tag
      # itself so its message can become the release notes.
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the release files
        run: scripts/ci/release-files.sh "$GITHUB_REF_NAME" release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$notes"
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file "$notes"
