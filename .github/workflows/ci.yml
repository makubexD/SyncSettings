name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak scan
        run: scripts/ci/leak-scan.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x export.sh import.sh commit.sh scripts/linux/sync.sh scripts/ci/*.sh tests/linux/*.sh
      - name: Validate JSON
        run: jq empty sync-config.json
      - name: Config sanity
        run: |
          jq -r '
          [
            (.files[] | select((.repoPath // "") == "" or (.localPath // "") == "") | .repoPath // "<missing repoPath>"),
            (.files | group_by(.repoPath)[] | select(length > 1) | .[0].repoPath | select(. != null and . != "")),
            (.files[] | select((.platform // "") | IN("common", "windows", "linux") | not) | .repoPath // "<missing repoPath>"),
            (.files[] | select(.platform == "linux") | select((.repoPath // "") | startswith("dotfiles/linux/") | not) | .repoPath // "<missing repoPath>"),
            (.files[] | select(.platform == "common") | select((.repoPath // "") | startswith("dotfiles/common/") | not) | .repoPath // "<missing repoPath>"),
            (.files[] | select(.platform == "windows") | select((.repoPath // "") | (startswith("dotfiles/linux/") or startswith("dotfiles/common/"))) | .repoPath // "<missing repoPath>"),
            (.files[] | select(.platform == "common") | select((.localPath // "") | startswith("~/") | not) | .repoPath // "<missing repoPath>"),
            (.files[] | select(has("type") and ((.type == "file" or .type == "dir") | not)) | .repoPath // "<missing repoPath>"),
            (.files[] | select(.type == "dir") | select(has("sanitizeRules") or has("detectLinkedPaths")) | .repoPath // "<missing repoPath>")
          ] | unique as $bad
          | if ($bad | length) == 0
            then "sync-config.json: OK"
            else ($bad[]), ("sync-config.json: invalid entries above\n" | halt_error(1))
            end
          ' sync-config.json
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          $r
          if ($r) { exit 1 }
  engine-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine contract tests (bash)
        run: tests/linux/engine.sh
  engine-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run engine tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester -Path tests/windows -CI
