name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The CI minutes rule (docs/plan-single-engine-10.md, decision 2): the macOS
  # and Windows jobs cost 10x and 2x, so a PR runs them only when it changes
  # what they test. A push to master and a manual run always run them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.diff.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did engine or installer files change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [[ $EVENT != pull_request ]]; then
            echo "platforms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(src/|tests/|install\.sh$|install\.ps1$|bootstrap/|mksync$|mksync\.cmd$|package\.json$|bun\.lock$|scripts/ci/|\.github/workflows/ci\.yml$)'
          # A diff that fails runs every job rather than skipping them.
          if ! changed=$(git diff --name-only "origin/$BASE...HEAD") || grep -Eq "$pattern" <<< "$changed"; then
            echo "platforms=true" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=false" >> "$GITHUB_OUTPUT"
          fi
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak scan
        run: scripts/ci/leak-scan.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x bootstrap/linux.sh install.sh mksync scripts/ci/*.sh tests/linux/*.sh tests/macos/*.sh tests/parity/run.sh tests/all.sh tests/windows-vm/vm.sh
      - name: Validate JSON
        run: jq empty sync-config.json
      - name: Plugin sanity
        run: scripts/ci/check-plugins.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = @(Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error)
          $r += @(Invoke-ScriptAnalyzer -Path tests/parity/run.ps1 -Severity Error)
          $r
          if ($r) { exit 1 }
  # The manual macOS checks M1-M3 (TODO.md) on a real macOS runner: the README install line from a
  # stock Mac's point of view, then mksync status, import --check and the clone's ./mksync doctor.
  macos-checks:
    needs: changes
    if: needs.changes.outputs.platforms == 'true'
    runs-on: macos-latest
    env:
      SYNCSETTINGS_INSTALL_URL: file://${{ github.workspace }}/install.sh
      SYNCSETTINGS_REPO_URL: https://github.com/${{ github.repository }}.git
      SYNCSETTINGS_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The installer downloads the program from a release. This branch's
      # program goes in a file:// release folder, laid out as GitHub serves
      # one, so M1 installs what this branch builds and never a published one.
      - name: Build a release folder from this branch
        run: |
          bun install --frozen-lockfile
          release="$RUNNER_TEMP/release"
          tag="v$(jq -r .version package.json)"
          mkdir -p "$release/download/$tag"
          bun build --compile --target bun-darwin-arm64 src/main.ts --outfile "$release/download/$tag/mksync-darwin-arm64"
          (cd "$release/download/$tag" && shasum -a 256 mksync-darwin-arm64 > SHA256SUMS)
          printf '%s\n' "$tag" > "$release/latest"
          echo "SYNCSETTINGS_RELEASE_URL=file://$release" >> "$GITHUB_ENV"
      - name: Remove Homebrew bash and jq, so the installer asks for them
        run: brew uninstall --ignore-dependencies bash jq || true
      # The installer reopens the file for each yes/no question, so it always
      # reads line 1 (y); setup then reads the file from the top: line 1 is a
      # new profile named y, an empty line for no label (a new profile's
      # label question), then Claude none, push with a preview, the
      # suggested backup for existing files, and y for every value the
      # program asks for (each placeholder nothing else fills) and any later
      # question.
      - name: Answer the installer and setup
        run: |
          { printf 'y\n\n1\n1\n\n'; for i in $(seq 50); do echo y; done; } > "$RUNNER_TEMP/answers.txt"
      - name: Run the macOS checks under the stock bash 3.2
        run: |
          export SYNCSETTINGS_DIR="$RUNNER_TEMP/SyncSettings" SYNCSETTINGS_TTY="$RUNNER_TEMP/answers.txt"
          /bin/bash tests/macos/manual-checks.sh
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-checks-report
          path: ~/mksync-macos-checks-*.txt
  program-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun test src tools
      - name: Config check
        run: bun run tools/check-config.ts
      - name: Compile for Linux x64
        run: bun build --compile --target bun-linux-x64 src/main.ts --outfile dist/mksync-linux-x64
      - name: Compile for Linux arm64
        run: bun build --compile --target bun-linux-arm64 src/main.ts --outfile dist/mksync-linux-arm64
      - name: Compile for macOS arm64
        run: bun build --compile --target bun-darwin-arm64 src/main.ts --outfile dist/mksync-darwin-arm64
      - name: Compile for Windows x64
        run: bun build --compile --target bun-windows-x64 src/main.ts --outfile dist/mksync-windows-x64.exe
      - name: Upload the programs
        uses: actions/upload-artifact@v4
        with:
          name: mksync-${{ github.sha }}
          path: dist/
          retention-days: 14
      - name: Shared cases (program, Linux)
        run: chmod +x dist/mksync-linux-x64 && tests/parity/run.sh --engine dist/mksync-linux-x64
      - name: Bootstrap tests
        run: tests/linux/bootstrap.sh
  program-macos:
    runs-on: macos-latest
    needs: [changes, program-build]
    if: needs.changes.outputs.platforms == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install bash and jq
        run: brew install bash jq
      - name: Download the programs
        uses: actions/download-artifact@v4
        with:
          name: mksync-${{ github.sha }}
          path: dist
      - name: Make the program executable
        run: chmod +x dist/mksync-darwin-arm64
      - name: Shared cases (program, macOS)
        run: /opt/homebrew/bin/bash tests/parity/run.sh --engine dist/mksync-darwin-arm64
  program-windows:
    runs-on: windows-latest
    needs: [changes, program-build]
    if: needs.changes.outputs.platforms == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Download the programs
        uses: actions/download-artifact@v4
        with:
          name: mksync-${{ github.sha }}
          path: dist
      - name: Shared cases (program, Windows)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/parity/run.ps1 -Engine dist/mksync-windows-x64.exe
  bootstrap-check:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the lists on a clean Ubuntu
        run: scripts/ci/bootstrap-check.sh
