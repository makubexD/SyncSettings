name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak scan
        run: scripts/ci/leak-scan.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x bootstrap/linux.sh export.sh import.sh commit.sh sync install.sh scripts/linux/sync.sh scripts/linux/front.sh scripts/ci/*.sh tests/linux/*.sh tests/parity/run.sh
      - name: Validate JSON
        run: jq empty sync-config.json
      - name: Config sanity
        run: scripts/ci/check-config.sh
      - name: Plugin sanity
        run: scripts/ci/check-plugins.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error)
          $r += @(Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error)
          $r += @(Invoke-ScriptAnalyzer -Path tests/parity/run.ps1 -Severity Error)
          $r
          if ($r) { exit 1 }
  engine-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dconf
        run: sudo apt-get update && sudo apt-get install -y dconf-cli dbus
      - name: Engine contract tests (bash)
        run: tests/linux/engine.sh
      - name: Shared cases (bash)
        run: tests/parity/run.sh
      - name: Bootstrap tests (bash)
        run: tests/linux/bootstrap.sh
  engine-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bash and jq
        run: brew install bash jq
      - name: Engine contract tests (bash, macOS)
        run: /opt/homebrew/bin/bash tests/linux/engine.sh
      - name: Shared cases (bash, macOS)
        run: /opt/homebrew/bin/bash tests/parity/run.sh
      - name: System bash reaches the guard
        shell: bash
        run: |
          set -u

          doctor_status=0
          doctor_out=$(/bin/bash ./sync doctor 2>&1) || doctor_status=$?
          printf '%s\n' "$doctor_out"
          printf 'doctor exit status: %s\n' "$doctor_status"
          if printf '%s\n' "$doctor_out" | grep -q 'MISSING.*bash 4 or newer'; then
            echo 'system-bash: doctor reports MISSING bash 4 (guard reached, no re-exec)'
          elif printf '%s\n' "$doctor_out" | grep -qE 'declare: -A|invalid option|syntax error|needs bash 4'; then
            echo 'FAIL: /bin/bash did not re-exec into Homebrew bash for doctor'
            exit 1
          else
            echo 'system-bash: doctor re-exec into Homebrew bash'
          fi

          export_status=0
          export_out=$(HOME="$(mktemp -d)" /bin/bash ./export.sh < /dev/null 2>&1) || export_status=$?
          printf '%s\n' "$export_out"
          printf 'export exit status: %s\n' "$export_status"
          if printf '%s\n' "$export_out" | grep -qE 'declare: -A|invalid option|needs bash 4'; then
            echo 'FAIL: /bin/bash did not re-exec into Homebrew bash for export.sh'
            exit 1
          fi
  engine-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run engine tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester -Path tests/windows -CI
      - name: Shared cases (PowerShell)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/parity/run.ps1
  bootstrap-check:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the lists on a clean Ubuntu
        run: scripts/ci/bootstrap-check.sh
