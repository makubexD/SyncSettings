[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[retriever]
mode = "sqlite"
max_entry_bytes = 10485760
max_entries = 200
retention_days = 30
compression = true
tee_max_files = 20
tee_max_file_size = 1048576
tee_on_success = false

[telemetry]
enabled = true
consent_given = true
consent_date = "2026-10-27T21:55:02.565499738+00:00"

[hooks]
exclude_commands = []
transparent_prefixes = []
suppress_hook_warning = false
wrap_fish_scripts = false

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000

[awareness]
level = "default"
