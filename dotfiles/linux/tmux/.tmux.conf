# Maku developer tmux configuration

# Prefix: Ctrl+A
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Terminal and scrollback
set -g history-limit 10000
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"

# Create windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Split panes in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload configuration
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Copy selected text to tmux buffer and system clipboard
bind-key -T copy-mode M-w send -X copy-pipe-and-cancel "xclip -selection clipboard"
bind-key -T copy-mode-vi M-w send -X copy-pipe-and-cancel "xclip -selection clipboard"
